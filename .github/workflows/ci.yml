name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-only-jwt-signing-secret-at-least-32-bytes
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Set up Chrome for the browser workflow test
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Verify tests and package
        run: mvn --batch-mode --no-transfer-progress verify -Dbrowser.tests=true
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_id }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-${{ github.run_id }}
          path: target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 7
      - name: SpotBugs static analysis report (non-blocking until triaged)
        run: mvn --batch-mode --no-transfer-progress spotbugs:spotbugs
      - name: Upload SpotBugs findings
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-${{ github.run_id }}
          path: target/spotbugsXml.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Generate CycloneDX SBOM
        run: mvn --batch-mode --no-transfer-progress cyclonedx:makeAggregateBom
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.run_id }}
          path: target/bom.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Build container image
        run: docker build --tag it-helpdesk:ci .
      - name: Run Compose integration smoke check
        run: bash scripts/compose-smoke.sh
