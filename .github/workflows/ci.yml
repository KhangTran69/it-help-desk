name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-only-jwt-signing-secret-at-least-32-bytes
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify tests and package
        run: mvn --batch-mode --no-transfer-progress verify -Dbrowser.tests=true
      - name: Build container image
        run: docker build --tag it-helpdesk:ci .
      - name: Run Compose integration smoke check
        run: bash scripts/compose-smoke.sh
