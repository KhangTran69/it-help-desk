name: Publish container image

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable release label, such as v1.2.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build image locally for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: it-helpdesk:release-scan
      - name: Block publication on high or critical vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: it-helpdesk:release-scan
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish tagged image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/khangtran69/it-helpdesk:${{ inputs.release_tag }}
            ghcr.io/khangtran69/it-helpdesk:${{ github.sha }}
