spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/it_helpdesk?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  thymeleaf:
    cache: false
  cache:
    type: none
management:
  health:
    redis:
      enabled: false
logging:
  level:
    com.example.helpdesk: DEBUG
jwt:
  secret: ${JWT_SECRET:local-development-only-secret-not-for-deployment}
