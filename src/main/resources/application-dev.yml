spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:it_helpdesk}?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: ${DB_USERNAME:helpdesk}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  thymeleaf:
    cache: false
  cache:
    type: none
management:
  health:
    redis:
      enabled: false
logging:
  level:
    com.example.helpdesk: DEBUG
