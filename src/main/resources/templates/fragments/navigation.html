<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<aside th:fragment="sidebar(section)">
  <h2 class="brand"><i class="brand-mark"></i><span>IT Helpdesk</span></h2>
  <nav th:if="${isTechnician}" aria-label="Technician navigation">
    <a th:href="@{/}" th:classappend="${section == 'dashboard'} ? 'active'" th:attr="aria-current=${section == 'dashboard'} ? 'page'"><b class="nav-icon" aria-hidden="true">⌂</b><span>Dashboard</span></a>
    <a th:href="@{/tickets}" th:classappend="${section == 'tickets' or section == 'ticket-new'} ? 'active'" th:attr="aria-current=${section == 'tickets'} ? 'page'"><b class="nav-icon" aria-hidden="true">▣</b><span>Tickets</span></a>
    <a th:href="@{/assets}" th:classappend="${section == 'assets'} ? 'active'" th:attr="aria-current=${section == 'assets'} ? 'page'"><b class="nav-icon" aria-hidden="true">▤</b><span>Assets</span></a>
    <a th:href="@{/users}" th:classappend="${section == 'users'} ? 'active'" th:attr="aria-current=${section == 'users'} ? 'page'"><b class="nav-icon" aria-hidden="true">♙</b><span>Accounts</span></a>
    <a th:href="@{/notifications}" th:classappend="${section == 'notifications'} ? 'active'" th:attr="aria-current=${section == 'notifications'} ? 'page'"><b class="nav-icon" aria-hidden="true">◔</b><span>Notifications</span><span th:if="${unreadNotifications != null and unreadNotifications > 0}" class="badge" th:text="${unreadNotifications}">0</span></a>
  </nav>
  <nav th:unless="${isTechnician}" aria-label="Employee navigation">
    <a th:href="@{/my-tickets}" th:classappend="${section == 'my-tickets'} ? 'active'" th:attr="aria-current=${section == 'my-tickets'} ? 'page'"><b class="nav-icon" aria-hidden="true">▣</b><span>My Tickets</span></a>
    <a th:href="@{/tickets/new}" th:classappend="${section == 'ticket-new'} ? 'active'" th:attr="aria-current=${section == 'ticket-new'} ? 'page'"><b class="nav-icon" aria-hidden="true">＋</b><span>Create Ticket</span></a>
    <a th:href="@{/notifications}" th:classappend="${section == 'notifications'} ? 'active'" th:attr="aria-current=${section == 'notifications'} ? 'page'"><b class="nav-icon" aria-hidden="true">◔</b><span>Notifications</span><span th:if="${unreadNotifications != null and unreadNotifications > 0}" class="badge" th:text="${unreadNotifications}">0</span></a>
  </nav>
  <form class="signout" th:if="${currentUser != null}" method="post" action="/logout">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <button class="link"><b class="nav-icon" aria-hidden="true">↪</b><span>Sign out</span></button>
  </form>
</aside>
</body>
</html>
