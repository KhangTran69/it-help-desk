<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accounts | IT Helpdesk</title><link rel="stylesheet" href="/css/app.css"></head>
<body>
<aside><h2 class="brand"><i class="brand-mark"></i><span>IT Helpdesk</span></h2><nav><a href="/"><b class="nav-icon" aria-hidden="true">⌂</b><span>Dashboard</span></a><a href="/tickets"><b class="nav-icon" aria-hidden="true">▣</b><span>Tickets</span></a><a href="/assets"><b class="nav-icon" aria-hidden="true">▤</b><span>Assets</span></a><a class="active" href="/users" aria-current="page"><b class="nav-icon" aria-hidden="true">♙</b><span>Accounts</span></a></nav><form class="signout" method="post" action="/logout"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="link"><b class="nav-icon" aria-hidden="true">↪</b><span>Sign out</span></button></form></aside>
<main class="content"><div class="topbar"><a href="/">← Dashboard</a></div><div class="page-head"><div><p class="eyebrow">ACCESS MANAGEMENT</p><h1>Accounts</h1><p class="muted">Disable access for an account. Existing browser sessions end on the next request; JWT calls are rejected immediately.</p></div></div>
<div th:if="${success}" class="notice success" role="status" th:text="${success}"></div>
<div class="table-wrap"><table><thead><tr><th>Name</th><th>Username</th><th>Role</th><th>Access</th><th>Action</th></tr></thead><tbody><tr th:each="u : ${users}"><td th:text="${u.fullName}"></td><td th:text="${u.username}"></td><td th:text="${u.role}"></td><td><span class="badge" th:classappend="${u.enabled ? ' AVAILABLE' : ' RETIRED'}" th:text="${u.enabled ? 'Enabled' : 'Disabled'}"></span></td><td><form method="post" th:action="@{'/users/' + ${u.id} + '/enabled'}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="enabled" th:value="${!u.enabled}"><button class="button secondary" type="submit" th:text="${u.enabled ? 'Disable' : 'Enable'}"></button></form></td></tr></tbody></table></div></main>
</body></html>
