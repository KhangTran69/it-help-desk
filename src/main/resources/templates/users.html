<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accounts | IT Helpdesk</title><link rel="stylesheet" href="/css/app.css"></head>
<body>
<aside th:replace="~{fragments/navigation :: sidebar('users')}"></aside>
<main class="content"><div class="topbar"><a href="/">← Dashboard</a></div><div class="page-head"><div><p class="eyebrow">ACCESS MANAGEMENT</p><h1>Accounts</h1><p class="muted">Disable access for an account. Existing browser sessions end on the next request; JWT calls are rejected immediately.</p></div></div>
<div th:if="${success}" class="notice success" role="status" th:text="${success}"></div>
<div class="table-wrap"><table><thead><tr><th>Name</th><th>Username</th><th>Role</th><th>Access</th><th>Action</th></tr></thead><tbody><tr th:each="u : ${users}"><td th:text="${u.fullName}"></td><td th:text="${u.username}"></td><td><span th:text="${u.role}"></span><form th:if="${currentUser != null and currentUser.role.name() == 'ADMIN' and currentUser.username != u.username}" method="post" th:action="@{'/users/' + ${u.id} + '/role'}" style="display:inline-flex;gap:4px;margin-top:6px;"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><select name="role" aria-label="Change role" style="font-size:12px;padding:4px;"><option th:each="r : ${T(com.example.helpdesk.model.Role).values()}" th:value="${r}" th:text="${r}" th:selected="${r == u.role}"></option></select><button class="button secondary" type="submit" style="padding:4px 10px;font-size:12px;">Set</button></form></td><td><span class="badge" th:classappend="${u.enabled ? ' AVAILABLE' : ' RETIRED'}" th:text="${u.enabled ? 'Enabled' : 'Disabled'}"></span></td><td th:with="canDisable=${u.role.name() == 'EMPLOYEE' or (currentUser != null and currentUser.role.name() == 'ADMIN')}"><form th:if="${canDisable}" method="post" th:action="@{'/users/' + ${u.id} + '/enabled'}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="enabled" th:value="${!u.enabled}"><button class="button secondary" type="submit" th:text="${u.enabled ? 'Disable' : 'Enable'}"></button></form><span th:unless="${canDisable}" class="muted small">Admin only</span></td></tr></tbody></table></div></main>
</body></html>
