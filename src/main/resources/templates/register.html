<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create employee account | IT Helpdesk</title><link rel="stylesheet" href="/css/app.css"></head><body class="login"><main class="card"><h1>Create employee account</h1><p class="muted">Create an account to submit and track your IT support tickets.</p><p class="notice" th:if="${error}" th:text="${error}"></p><form method="post" action="/register"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Full name<input name="fullName" required maxlength="120"></label><label>Username<input name="username" required minlength="3" maxlength="80"></label><label>Password<input name="password" type="password" required minlength="8"></label><label>Confirm password<input name="confirmPassword" type="password" required minlength="8"></label><button>Create account</button></form><p class="muted small"><a href="/login">← Back to sign in</a></p></main></body></html>
