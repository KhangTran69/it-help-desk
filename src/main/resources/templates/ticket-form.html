<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>New ticket</title><link rel="stylesheet" href="/css/app.css"></head><body><main class="content narrow"><a href="/tickets">← Back</a><h1>Create a support ticket</h1><form method="post" action="/tickets" class="card"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Title<input name="title" required maxlength="160"></label><label>Description<textarea name="description" required rows="6"></textarea></label><label>Category<select name="category"><option th:each="c:${categories}" th:value="${c}" th:text="${c}"></option></select></label><label>Priority<select name="priority"><option th:each="p:${priorities}" th:value="${p}" th:text="${p}"></option></select></label><button>Submit ticket</button></form></main></body></html>
