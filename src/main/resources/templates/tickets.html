<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Tickets</title><link rel="stylesheet" href="/css/app.css"></head><body><aside><h2>IT Helpdesk</h2><nav><a href="/">Dashboard</a><a href="/tickets">Tickets</a><a href="/assets">Assets</a></nav></aside><main class="content"><header><h1>Support tickets</h1><a class="button" href="/tickets/new">New ticket</a></header><form class="search"><input name="q" placeholder="Search by title or ID" th:value="${q}"><button>Search</button></form><div class="table-wrap"><table><tr><th>ID</th><th>Title</th><th>Status</th><th>Priority</th><th>Category</th></tr><tr th:each="t:${tickets}"><td th:text="${'#'+t.id}"></td><td th:text="${t.title}"></td><td><span class="badge" th:text="${t.status}"></span></td><td th:text="${t.priority}"></td><td th:text="${t.category}"></td></tr></table></div></main></body></html>
