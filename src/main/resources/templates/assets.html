<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Assets | IT Helpdesk</title><link rel="stylesheet" href="/css/app.css"></head><body><aside><h2 class="brand"><i class="brand-mark"></i><span>IT Helpdesk</span></h2><nav><a href="/"><b class="nav-icon">⌂</b><span>Dashboard</span></a><a href="/tickets"><b class="nav-icon">▣</b><span>Tickets</span></a><a class="active" href="/assets"><b class="nav-icon">▤</b><span>Assets</span></a></nav><form class="signout" method="post" action="/logout"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="link"><b class="nav-icon">↪</b><span>Sign out</span></button></form></aside><main class="content"><div class="topbar"><span>Operations workspace</span><div class="profile"><span class="avatar">KT</span><span>IT Helpdesk</span></div></div><div class="page-head"><div><p class="eyebrow">INVENTORY</p><h1>Asset inventory</h1><p class="muted">Manage company equipment and assigned devices.</p></div><a class="button" href="/assets/new">＋ Add asset</a></div><div class="toolbar"><form class="search" method="get"><input name="q" placeholder="Search asset tag or equipment" th:value="${q}"><button>Search</button></form><select class="filter"><option>Status: All</option><option>Available</option><option>Assigned</option><option>Retired</option></select></div><div class="table-wrap"><table><thead><tr><th>Asset tag</th><th>Equipment</th><th>Category</th><th>Manufacturer</th><th>Status</th><th>Action</th></tr></thead><tbody><tr th:each="a:${assets}"><td><strong th:text="${a.assetTag}"></strong></td><td th:text="${a.name}"></td><td th:text="${a.category}"></td><td th:text="${a.manufacturer ?: '—'}"></td><td><span class="badge" th:text="${a.status}"></span></td><td><a class="button secondary" href="/assets">View</a></td></tr><tr th:if="${#lists.isEmpty(assets)}"><td colspan="6" class="empty">No assets found. Add equipment to build your inventory.</td></tr></tbody></table></div></main></body></html>
