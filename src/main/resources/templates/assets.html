<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Assets</title><link rel="stylesheet" href="/css/app.css"></head><body><aside><h2>IT Helpdesk</h2><nav><a href="/">Dashboard</a><a href="/tickets">Tickets</a><a href="/assets">Assets</a></nav></aside><main class="content"><header><h1>Asset inventory</h1><a class="button" href="/assets/new">Add asset</a></header><form class="search"><input name="q" placeholder="Search tag or equipment" th:value="${q}"><button>Search</button></form><div class="table-wrap"><table><tr><th>Tag</th><th>Equipment</th><th>Category</th><th>Status</th></tr><tr th:each="a:${assets}"><td th:text="${a.assetTag}"></td><td th:text="${a.name}"></td><td th:text="${a.category}"></td><td><span class="badge" th:text="${a.status}"></span></td></tr></table></div></main></body></html>
