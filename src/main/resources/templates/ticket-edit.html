<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit ticket | IT Helpdesk</title><link rel="stylesheet" href="/css/app.css"></head>
<body><aside><h2 class="brand"><i class="brand-mark"></i><span>IT Helpdesk</span></h2><nav><a href="/"><b class="nav-icon" aria-hidden="true">⌂</b><span>Dashboard</span></a><a class="active" href="/tickets" aria-current="page"><b class="nav-icon" aria-hidden="true">▣</b><span>Tickets</span></a><a href="/assets"><b class="nav-icon" aria-hidden="true">▤</b><span>Assets</span></a></nav><form class="signout" method="post" action="/logout"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="link"><b class="nav-icon" aria-hidden="true">↪</b><span>Sign out</span></button></form></aside>
<main class="content narrow"><div class="topbar"><a th:href="@{'/tickets/' + ${ticket.id}}">← Back to ticket</a></div><div class="page-head"><div><p class="eyebrow" th:text="${'#' + ticket.id}">TICKET</p><h1>Edit ticket</h1><p class="muted">Update ticket details and support workflow.</p></div></div>
  <form class="card form-card" method="post" th:action="@{'/tickets/' + ${ticket.id} + '/edit'}" th:object="${form}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" th:field="*{version}">
    <label>Title<input th:field="*{title}" maxlength="160" required><span class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span></label>
    <label>Description<textarea th:field="*{description}" rows="6" required></textarea><span class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span></label>
    <div class="form-grid"><label>Category<select th:field="*{category}" required><option value="">Choose category</option><option th:each="c : ${categories}" th:value="${c}" th:text="${c}"></option></select></label><label>Priority<select th:field="*{priority}" required><option th:each="p : ${priorities}" th:value="${p}" th:text="${p}"></option></select></label></div>
    <div class="form-grid"><label>Status<select th:field="*{status}"><option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option></select></label><label>Assignee<select th:field="*{technicianId}"><option value="">Unassigned</option><option th:each="tech : ${technicians}" th:value="${tech.id}" th:text="${tech.fullName}"></option></select></label></div>
    <label>Resolution / closure notes<textarea th:field="*{resolutionNotes}" id="notes" rows="3" placeholder="Required when status is Resolved or Closed"></textarea></label>
    <div class="actions"><button type="submit">Save changes</button><a class="button secondary" th:href="@{'/tickets/' + ${ticket.id}}">Cancel</a></div>
  </form>
</main><script>const statusSelect=document.getElementById('status'),notes=document.getElementById('notes');function setNotesRule(){notes.required=statusSelect.value==='RESOLVED'||statusSelect.value==='CLOSED';}statusSelect.addEventListener('change',setNotesRule);setNotesRule();</script></body></html>
