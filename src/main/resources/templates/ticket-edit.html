<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit ticket | IT Helpdesk</title><link rel="stylesheet" href="/css/app.css"></head><body><main class="content narrow"><div class="topbar"><a th:href="@{'/tickets/'+${ticket.id}}">← Back to ticket</a></div><div class="page-head"><div><p class="eyebrow" th:text="${'#'+ticket.id}">TICKET</p><h1>Edit ticket</h1><p class="muted">Update the existing ticket without creating a duplicate.</p></div></div><form class="card form-card" method="post" th:action="@{'/tickets/'+${ticket.id}+'/edit'}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="form-grid"><label class="full">Title<input name="title" required maxlength="160" th:value="${ticket.title}"></label><label class="full">Description<textarea name="description" required rows="6" th:text="${ticket.description}"></textarea></label><label>Category<select name="category"><option th:each="c:${categories}" th:value="${c}" th:text="${c}" th:selected="${c==ticket.category}"></option></select></label><label>Priority<select name="priority"><option th:each="p:${priorities}" th:value="${p}" th:text="${p}" th:selected="${p==ticket.priority}"></option></select></label></div><div class="actions"><button>Save changes</button><a class="button secondary" th:href="@{'/tickets/'+${ticket.id}}">Cancel</a></div></form></main></body></html>
