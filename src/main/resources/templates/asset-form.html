<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title th:text="(${isEdit} ? 'Edit Asset' : 'Add Asset') + ' | IT Helpdesk'">Asset Form | IT Helpdesk</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<aside>
  <h2 class="brand"><i class="brand-mark"></i><span>IT Helpdesk</span></h2>
  <nav>
    <a href="/"><b class="nav-icon">⌂</b><span>Dashboard</span></a>
    <a href="/tickets"><b class="nav-icon">▣</b><span>Tickets</span></a>
    <a class="active" href="/assets" aria-current="page"><b class="nav-icon" aria-hidden="true">▤</b><span>Assets</span></a>
  </nav>
  <form class="signout" method="post" action="/logout">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <button class="link"><b class="nav-icon">↪</b><span>Sign out</span></button>
  </form>
</aside>
<main class="content narrow">
  <div class="topbar">
    <a href="/assets">← Back to assets</a>
    <div class="profile" th:if="${currentUser != null}">
      <span class="avatar" th:text="${currentUser.initials}">KT</span>
      <span th:text="${currentUser.fullName} + ' (' + ${currentUser.role} + ')'">User</span>
    </div>
  </div>

  <div class="page-head">
    <div>
      <p class="eyebrow" th:text="${isEdit} ? 'INVENTORY UPDATE' : 'NEW EQUIPMENT'">INVENTORY</p>
      <h1 th:text="${isEdit} ? 'Edit Equipment Asset' : 'Register New Asset'">Asset Form</h1>
      <p class="muted" th:text="${isEdit} ? 'Update equipment specification, assignment, or operational status.' : 'Register company hardware and assign to an employee.'">Manage equipment details.</p>
    </div>
  </div>

  <div th:if="${error}" class="notice error" th:text="${error}"></div>
  <div th:if="${success}" class="notice success" th:text="${success}"></div>

  <form method="post" th:action="${isEdit} ? @{'/assets/' + ${asset.id} + '/edit'} : @{/assets}" th:object="${form}" class="card form-card">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <input th:if="${isEdit}" type="hidden" th:field="*{version}">

    <div class="form-grid">
      <label>
        Asset Tag <span style="color:#dc2626">*</span>
        <input type="text" th:field="*{assetTag}" placeholder="e.g., LAP-2024-001" required
               th:classappend="${#fields.hasErrors('assetTag')} ? 'input-error'">
        <span th:if="${#fields.hasErrors('assetTag')}" th:errors="*{assetTag}" class="field-error"></span>
      </label>

      <label>
        Equipment Name <span style="color:#dc2626">*</span>
        <input type="text" th:field="*{name}" placeholder="e.g., ThinkPad T14s Gen 4" required
               th:classappend="${#fields.hasErrors('name')} ? 'input-error'">
        <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="field-error"></span>
      </label>
    </div>

    <div class="form-grid">
      <label>
        Category <span style="color:#dc2626">*</span>
        <input type="text" th:field="*{category}" placeholder="Laptop, Monitor, Server, Mobile..." required
               th:classappend="${#fields.hasErrors('category')} ? 'input-error'">
        <span th:if="${#fields.hasErrors('category')}" th:errors="*{category}" class="field-error"></span>
      </label>

      <label>
        Manufacturer
        <input type="text" th:field="*{manufacturer}" placeholder="Lenovo, Dell, Apple, Cisco...">
        <span th:if="${#fields.hasErrors('manufacturer')}" th:errors="*{manufacturer}" class="field-error"></span>
      </label>
    </div>

    <div class="form-grid">
      <label>
        Serial Number
        <input type="text" th:field="*{serialNumber}" placeholder="e.g., PF-3A7B9C">
        <span th:if="${#fields.hasErrors('serialNumber')}" th:errors="*{serialNumber}" class="field-error"></span>
      </label>

      <label>
        Purchase Date
        <input type="date" th:field="*{purchaseDate}">
        <span th:if="${#fields.hasErrors('purchaseDate')}" th:errors="*{purchaseDate}" class="field-error"></span>
      </label>
    </div>

    <div class="form-grid">
      <label>
        Operational Status <span style="color:#dc2626">*</span>
        <select id="assetStatusSelect" th:field="*{status}" required>
          <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
        </select>
        <span th:if="${#fields.hasErrors('status')}" th:errors="*{status}" class="field-error"></span>
      </label>

      <label>
        Assigned User
        <select id="userSelect" th:field="*{assignedUserId}">
          <option value="">-- Unassigned (In Storage) --</option>
          <option th:each="u : ${users}" th:value="${u.id}" th:text="${u.fullName} + ' (' + ${u.username} + ' - ' + ${u.role} + ')'"></option>
        </select>
        <span id="retiredWarning" class="muted small" style="color:#dc2626; display:none;">Retired assets cannot be assigned to any user.</span>
      </label>
    </div>

    <label>
      Notes & Specifications
      <textarea th:field="*{notes}" rows="3" placeholder="RAM, Storage specs, accessories included, warranty info..."></textarea>
    </label>

    <div class="actions">
      <button type="submit" th:text="${isEdit} ? 'Save Asset Changes' : 'Save Asset'">Save Asset</button>
      <a class="button secondary" href="/assets">Cancel</a>
    </div>
  </form>
</main>

<script>
  const statusSel = document.getElementById('assetStatusSelect');
  const userSel = document.getElementById('userSelect');
  const warning = document.getElementById('retiredWarning');

  function handleStatusChange() {
    if (!statusSel || !userSel) return;
    if (statusSel.value === 'RETIRED') {
      userSel.value = '';
      userSel.disabled = true;
      if (warning) warning.style.display = 'block';
    } else {
      userSel.disabled = false;
      if (warning) warning.style.display = 'none';
    }
  }

  if (statusSel) {
    statusSel.addEventListener('change', handleStatusChange);
    handleStatusChange();
  }
</script>
</body>
</html>
