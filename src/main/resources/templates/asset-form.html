<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Add asset</title><link rel="stylesheet" href="/css/app.css"></head><body><main class="content narrow"><a href="/assets">← Back</a><h1>Add an asset</h1><form method="post" action="/assets" class="card"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Asset tag<input name="assetTag" placeholder="AST-0001" required></label><label>Equipment name<input name="name" required></label><label>Category<input name="category" required></label><label>Manufacturer<input name="manufacturer"></label><label>Serial number<input name="serialNumber"></label><label>Status<select name="status"><option th:each="s:${statuses}" th:value="${s}" th:text="${s}"></option></select></label><label>Notes<textarea name="notes" rows="3"></textarea></label><button>Save asset</button></form></main></body></html>
