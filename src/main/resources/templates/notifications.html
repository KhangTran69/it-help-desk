<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Notifications | IT Helpdesk</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<aside>
  <h2 class="brand"><i class="brand-mark"></i><span>IT Helpdesk</span></h2>
  <nav th:if="${isTechnician}">
    <a href="/"><b class="nav-icon" aria-hidden="true">⌂</b><span>Dashboard</span></a>
    <a href="/tickets"><b class="nav-icon" aria-hidden="true">▣</b><span>Tickets</span></a>
    <a href="/assets"><b class="nav-icon" aria-hidden="true">▤</b><span>Assets</span></a>
    <a href="/notifications" class="active" aria-current="page"><b class="nav-icon" aria-hidden="true">◔</b><span>Notifications</span></a>
  </nav>
  <nav th:unless="${isTechnician}" aria-label="Employee navigation">
    <a href="/my-tickets"><b class="nav-icon" aria-hidden="true">▣</b><span>My Tickets</span></a>
    <a href="/tickets/new"><b class="nav-icon" aria-hidden="true">＋</b><span>Create Ticket</span></a>
    <a href="/notifications" class="active" aria-current="page"><b class="nav-icon" aria-hidden="true">◔</b><span>Notifications</span></a>
  </nav>
  <form class="signout" method="post" action="/logout">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <button class="link"><b class="nav-icon" aria-hidden="true">↪</b><span>Sign out</span></button>
  </form>
</aside>
<main class="content">
  <div class="topbar"><a th:href="${isTechnician} ? '/' : '/my-tickets'" th:text="${isTechnician} ? '← Back to dashboard' : '← Back to my tickets'">← Back</a></div>
  <div class="page-head">
    <div>
      <p class="eyebrow">UPDATES</p>
      <h1>Notifications</h1>
      <p class="muted">Status changes and assignments on tickets you report or handle.</p>
    </div>
    <form method="post" th:action="@{/notifications/read-all}">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <button class="button secondary" type="submit">Mark all read</button>
    </form>
  </div>
  <div th:if="${success}" class="notice success" role="status" th:text="${success}"></div>
  <div class="card" th:if="${!#lists.isEmpty(notifications)}">
    <article class="history-item" th:each="n : ${notifications}" th:classappend="${!n.read ? ' unread' : ''}">
      <strong><span th:if="${!n.read}" class="badge">New</span> <span th:text="${n.title}">Title</span></strong>
      <span th:text="${n.message}">Message</span>
      <small th:text="${@phTime.dateTime(n.createdAt)}">Date</small>
      <form method="post" th:action="@{/notifications/{id}/read(id=${n.id})}" th:if="${!n.read}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="link" type="submit">Mark as read</button>
      </form>
    </article>
  </div>
  <div class="card empty-state" th:if="${#lists.isEmpty(notifications)}">
    <div class="empty-icon" aria-hidden="true">◔</div>
    <h2>You're all caught up</h2>
    <p class="muted">Updates about your tickets will appear here.</p>
  </div>
</main>
</body>
</html>
