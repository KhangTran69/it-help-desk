<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Notifications | IT Helpdesk</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<aside th:replace="~{fragments/navigation :: sidebar('notifications')}"></aside>
<main class="content">
  <div class="topbar"><a th:href="${isTechnician} ? '/' : '/my-tickets'" th:text="${isTechnician} ? '← Back to dashboard' : '← Back to my tickets'">← Back</a></div>
  <div class="page-head">
    <div>
      <p class="eyebrow">UPDATES</p>
      <h1>Notifications</h1>
      <p class="muted">Status changes and assignments on tickets you report or handle.</p>
    </div>
    <form method="post" th:action="@{/notifications/read-all}">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <button class="button secondary" type="submit">Mark all read</button>
    </form>
  </div>
  <div th:if="${success}" class="notice success" role="status" th:text="${success}"></div>
  <div class="card" th:if="${notifications.totalElements > 0}">
    <article class="history-item" th:each="n : ${notifications.content}" th:classappend="${!n.read ? ' unread' : ''}">
      <strong><span th:if="${!n.read}" class="badge">New</span> <span th:text="${n.title}">Title</span></strong>
      <span th:text="${n.message}">Message</span>
      <small th:text="${@phTime.dateTime(n.createdAt)}">Date</small>
      <form method="post" th:action="@{/notifications/{id}/read(id=${n.id})}" th:if="${!n.read}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="link" type="submit">Mark as read</button>
      </form>
    </article>
  </div>
  <div class="pagination" th:if="${notifications.totalElements > 0}">
    <span th:text="|${notifications.totalElements} update(s) · page ${notifications.number + 1} of ${notifications.totalPages == 0 ? 1 : notifications.totalPages}|">0 update(s)</span>
    <span class="page-links">
      <a th:if="${notifications.hasPrevious()}" th:href="@{/notifications(page=${notifications.number - 1},size=${size})}">← Previous</a>
      <a th:if="${notifications.hasNext()}" th:href="@{/notifications(page=${notifications.number + 1},size=${size})}">Next →</a>
    </span>
  </div>
  <div class="card empty-state" th:if="${notifications.totalElements == 0}">
    <div class="empty-icon" aria-hidden="true">◔</div>
    <h2>You're all caught up</h2>
    <p class="muted">Updates about your tickets will appear here.</p>
  </div>
</main>
</body>
</html>
