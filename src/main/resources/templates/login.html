<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | Helpdesk</title><link rel="stylesheet" href="/css/app.css"></head><body class="login"><main class="card"><h1>IT Helpdesk</h1><p class="muted">Sign in to manage support requests.</p><p class="notice" th:if="${param.registered}">Account created. You can sign in now.</p><p class="notice error" th:if="${param.error}" role="alert">Username or password is incorrect.</p><form method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Username<input name="username" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button type="submit">Sign in</button></form><p class="muted small">New employee? <a href="/register">Create an account</a></p></main></body></html>
