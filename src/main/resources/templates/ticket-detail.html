<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ticket details | IT Helpdesk</title><link rel="stylesheet" href="/css/app.css"></head><body><aside><h2 class="brand"><i class="brand-mark"></i><span>IT Helpdesk</span></h2><nav><a href="/"><b class="nav-icon">⌂</b><span>Dashboard</span></a><a class="active" href="/tickets"><b class="nav-icon">▣</b><span>Tickets</span></a><a href="/assets"><b class="nav-icon">▤</b><span>Assets</span></a></nav></aside><main class="content narrow"><div class="topbar"><a href="/tickets">← Back to tickets</a></div><div class="page-head"><div><p class="eyebrow" th:text="${'#'+ticket.id}">TICKET</p><h1 th:text="${ticket.title}"></h1><div class="detail-meta"><span class="badge" th:classappend="' '+${ticket.status}" th:text="${ticket.status}"></span><span class="badge" th:classappend="' '+${ticket.priority}" th:text="${ticket.priority}"></span><span class="muted" th:text="${ticket.category}"></span></div></div><a class="button secondary" th:href="@{'/tickets/'+${ticket.id}+'/edit'}">Edit ticket</a></div><div class="card"><p th:text="${ticket.description}"></p><hr><form method="post" th:action="@{'/tickets/'+${ticket.id}+'/status'}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Status<select id="status" name="status"><option th:each="s:${statuses}" th:value="${s}" th:text="${s}" th:selected="${s==ticket.status}"></option></select></label><label>Resolution notes <span id="notes-help" class="muted">Required when resolving or closing</span><textarea id="notes" name="notes" rows="4" th:text="${ticket.resolutionNotes}"></textarea></label><div class="actions"><button>Save update</button><a class="button secondary" href="/tickets">Cancel</a></div></form></div><h2>Activity history</h2><div class="card"><div class="history-item" th:each="h:${history}"><strong th:text="${h.action}"></strong><span th:text="' — '+${h.details}"></span><small th:text="${h.createdAt}"></small></div><p class="empty" th:if="${#lists.isEmpty(history)}">No activity recorded yet.</p></div></main><script>const status=document.getElementById('status'),notes=document.getElementById('notes');function setNotesRule(){notes.required=status.value==='RESOLVED'||status.value==='CLOSED';}status.addEventListener('change',setNotesRule);setNotesRule();</script></body></html>
