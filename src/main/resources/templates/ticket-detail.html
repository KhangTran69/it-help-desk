<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Ticket</title><link rel="stylesheet" href="/css/app.css"></head><body><main class="content narrow"><a href="/tickets">← Back to tickets</a><h1 th:text="${ticket.title}"></h1><div class="card"><p th:text="${ticket.description}"></p><p><span class="badge" th:text="${ticket.status}"></span> <span th:text="${ticket.priority}"></span> · <span th:text="${ticket.category}"></span></p><hr><form method="post" th:action="@{'/tickets/'+${ticket.id}+'/status'}"><label>Status<select name="status"><option th:each="s:${statuses}" th:value="${s}" th:text="${s}" th:selected="${s==ticket.status}"></option></select></label><label>Resolution notes<textarea name="notes" rows="3" th:text="${ticket.resolutionNotes}"></textarea></label><button>Update ticket</button></form></div><h2>History</h2><div class="card" th:each="h:${history}"><strong th:text="${h.action}"></strong><span th:text="' — '+${h.details}"></span><small th:text="${h.createdAt}"></small></div></main></body></html>
