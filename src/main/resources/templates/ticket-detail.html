<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ticket details | IT Helpdesk</title><link rel="stylesheet" href="/css/app.css"></head>
<body><aside><h2 class="brand"><i class="brand-mark"></i><span>IT Helpdesk</span></h2><nav><a href="/"><b class="nav-icon">⌂</b><span>Dashboard</span></a><a class="active" href="/tickets"><b class="nav-icon">▣</b><span>Tickets</span></a><a href="/assets"><b class="nav-icon">▤</b><span>Assets</span></a></nav><form class="signout" method="post" action="/logout"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="link"><b class="nav-icon">↪</b><span>Sign out</span></button></form></aside>
<main class="content narrow"><div class="topbar"><a href="/tickets">← Back to tickets</a></div>
  <div th:if="${success}" class="notice success" role="status" th:text="${success}"></div>
  <div class="page-head"><div><p class="eyebrow" th:text="${'#' + ticket.id}">TICKET</p><h1 th:text="${ticket.title}">Ticket title</h1><div class="detail-meta"><span class="badge" th:classappend="' ' + ${ticket.status}" th:text="${ticket.status}"></span><span class="badge" th:classappend="' ' + ${ticket.priority}" th:text="${ticket.priority}"></span><span class="muted" th:text="${ticket.category}"></span></div></div><a class="button secondary" th:href="@{'/tickets/' + ${ticket.id} + '/edit'}">Edit ticket</a></div>
  <div class="card"><p class="eyebrow">REPORTED BY</p><p th:text="${ticket.reporter.fullName}">Employee</p><p class="eyebrow">DESCRIPTION</p><p class="pre-wrap" th:text="${ticket.description}">Description</p><p th:if="${ticket.resolutionNotes != null and !ticket.resolutionNotes.isBlank()}"><strong>Resolution notes</strong><br><span class="pre-wrap" th:text="${ticket.resolutionNotes}"></span></p><hr>
    <form method="post" th:action="@{'/tickets/' + ${ticket.id} + '/status'}" class="stack-form"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Status<select id="status" name="status"><option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${s == ticket.status}"></option></select></label><label>Resolution / closure notes<textarea id="notes" name="notes" rows="3" th:text="${ticket.resolutionNotes}" placeholder="Required to resolve or close this ticket"></textarea></label><button type="submit">Save status</button></form>
    <form method="post" th:action="@{'/tickets/' + ${ticket.id} + '/assign'}" class="inline-form"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Assign to<select name="technicianId" required><option value="">Choose technician</option><option th:each="tech : ${technicians}" th:value="${tech.id}" th:text="${tech.fullName}" th:selected="${ticket.technician != null and ticket.technician.id == tech.id}"></option></select></label><button type="submit">Assign</button></form>
  </div>
  <h2>Activity history</h2><div class="card"><div class="history-item" th:each="h : ${history}"><strong th:text="${h.action}">Action</strong><span th:text="${h.details}">Details</span><small th:text="${#temporals.format(h.createdAt, 'MMM d, yyyy HH:mm')}">Date</small><div th:if="${h.fieldChanged != null}"><span class="change-pill old" th:text="${h.previousValue ?: '—'}"></span><span class="change-pill new" th:text="${h.newValue ?: '—'}"></span></div></div><p class="empty" th:if="${#lists.isEmpty(history)}">No activity recorded yet.</p></div>
</main><script>const statusSelect=document.getElementById('status'),notes=document.getElementById('notes');function setNotesRule(){notes.required=statusSelect.value==='RESOLVED'||statusSelect.value==='CLOSED';}statusSelect.addEventListener('change',setNotesRule);setNotesRule();</script></body></html>
