spring:
  application:
    name: it-helpdesk
  profiles:
    default: dev
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  thymeleaf:
    cache: true
jwt:
  secret: ${JWT_SECRET:local-development-only-secret-not-for-deployment}
  expiration: ${JWT_EXPIRATION:900000}
server:
  error:
    whitelabel:
      enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true
info:
  app:
    name: IT Helpdesk
    description: IT Help Desk and Asset Management System
helpdesk:
  sla:
    targets:
      low: ${SLA_LOW_SECONDS:1209600}
      medium: ${SLA_MEDIUM_SECONDS:259200}
      high: ${SLA_HIGH_SECONDS:86400}
