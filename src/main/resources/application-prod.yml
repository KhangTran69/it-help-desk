spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/it_helpdesk?serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:helpdesk}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  shutdown: graceful
  tomcat:
    threads:
      max: 200
      min-spare: 10

jwt:
  secret: ${JWT_SECRET:mySecretKeyForJwtTokenGenerationThatIsAtLeast256BitsLongForHS256Algorithm}
  expiration: ${JWT_EXPIRATION:86400000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.example: INFO
