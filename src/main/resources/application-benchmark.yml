spring:
  datasource:
    url: jdbc:h2:mem:helpdesk_benchmark;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  cache:
    type: none
management:
  health:
    redis:
      enabled: false
logging:
  level:
    root: WARN
